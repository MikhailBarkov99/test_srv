{% extends 'base.html' %}
{% block title %}Register - Messenger{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="h4 mb-3">Create account</h2>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="register-username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="register-username" required>
                    </div>
                    <div class="mb-3">
                        <label for="register-email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="register-email" required>
                    </div>
                    <div class="mb-3">
                        <label for="register-first-name" class="form-label">First name</label>
                        <input type="text" class="form-control" id="register-first-name">
                    </div>
                    <div class="mb-3">
                        <label for="register-last-name" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="register-last-name">
                    </div>
                    <div class="mb-3">
                        <label for="register-password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="register-password" required>
                    </div>
                    <div class="mb-3">
                        <label for="register-password-confirm" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="register-password-confirm" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
                <div class="alert alert-danger mt-3 d-none" id="register-error"></div>
                <p class="mt-3">Already have an account? <a href="/login/">Login</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
