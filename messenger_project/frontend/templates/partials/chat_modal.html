<div class="modal fade" id="chatModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Chat</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="chat-form">
                    <div class="mb-3">
                        <label for="chat-name" class="form-label">Chat name</label>
                        <input type="text" class="form-control" id="chat-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="chat-members" class="form-label">Members (comma separated usernames)</label>
                        <input type="text" class="form-control" id="chat-members" placeholder="john,jane">
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="chat-is-group">
                        <label class="form-check-label" for="chat-is-group">Group chat</label>
                    </div>
                </form>
                <div class="alert alert-danger d-none" id="chat-error"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="save-chat-button">Save Chat</button>
            </div>
        </div>
    </div>
</div>
