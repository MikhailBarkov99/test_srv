{% extends 'base.html' %}
{% block title %}Profile - Messenger{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="h4 mb-3">My Profile</h2>
                <div id="profile-alert" class="alert alert-danger d-none"></div>
                <form id="profile-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="profile-username">Username</label>
                            <input type="text" id="profile-username" class="form-control" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="profile-email">Email</label>
                            <input type="email" id="profile-email" class="form-control" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="profile-first-name">First name</label>
                            <input type="text" id="profile-first-name" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="profile-last-name">Last name</label>
                            <input type="text" id="profile-last-name" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="profile-status">Status message</label>
                            <input type="text" id="profile-status" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Save changes</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
