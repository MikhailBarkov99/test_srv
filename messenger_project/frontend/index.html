<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <aside class="sidebar">
        <header>
          <h1>Messenger</h1>
          <button id="logout-btn" class="btn">Logout</button>
        </header>
        <section class="profile" id="profile-section">
          <h2>Profile</h2>
          <div id="profile-info"></div>
        </section>
        <section class="search">
          <input type="text" id="search-input" placeholder="Search chats or users" />
        </section>
        <section class="chat-list" id="chat-list"></section>
        <section class="contacts" id="contact-list"></section>
      </aside>
      <main class="chat-area">
        <section id="auth-section" class="auth-section">
          <h2>Login</h2>
          <form id="login-form">
            <input type="text" id="login-username" placeholder="Username" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <button type="submit" class="btn">Login</button>
          </form>
          <h3>or Register</h3>
          <form id="register-form">
            <input type="text" id="register-username" placeholder="Username" required />
            <input type="email" id="register-email" placeholder="Email" />
            <input type="password" id="register-password" placeholder="Password" required />
            <input type="password" id="register-password-confirm" placeholder="Confirm Password" required />
            <button type="submit" class="btn secondary">Register</button>
          </form>
        </section>
        <section id="chat-section" class="chat-section hidden">
          <header id="chat-header"></header>
          <div id="message-history" class="message-history"></div>
          <form id="message-form" class="message-form">
            <input type="text" id="message-input" placeholder="Type a message" autocomplete="off" />
            <button type="submit" class="btn">Send</button>
          </form>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
